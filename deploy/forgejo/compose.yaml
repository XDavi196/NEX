services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:17.0.1
    container_name: nex-forgejo
    restart: unless-stopped
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__server__DOMAIN: ${FORGEJO_DOMAIN}
      FORGEJO__server__ROOT_URL: https://${FORGEJO_DOMAIN}/
      FORGEJO__server__HTTP_PORT: "3000"
      FORGEJO__server__PROTOCOL: http
      FORGEJO__server__SSH_DOMAIN: ${FORGEJO_DOMAIN}
      FORGEJO__server__SSH_PORT: ${FORGEJO_SSH_PORT:-2222}
      FORGEJO__server__SSH_LISTEN_PORT: "22"
      FORGEJO__server__START_SSH_SERVER: "true"
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__mirror__DEFAULT_INTERVAL: 1h
      FORGEJO__actions__ENABLED: "false"
    volumes:
      - forgejo-data:/data
    expose:
      - "3000"
    ports:
      - "${FORGEJO_SSH_PORT:-2222}:22"
    networks:
      - nex-git

  caddy:
    image: caddy:2-alpine
    container_name: nex-forgejo-caddy
    restart: unless-stopped
    environment:
      FORGEJO_DOMAIN: ${FORGEJO_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - forgejo
    networks:
      - nex-git

  release-sync:
    image: python:3.13-alpine
    container_name: nex-forgejo-release-sync
    restart: unless-stopped
    environment:
      FORGEJO_API_URL: http://forgejo:3000/api/v1
      FORGEJO_TOKEN: ${FORGEJO_TOKEN:-}
      FORGEJO_OWNER: ${FORGEJO_OWNER:-XDavi196}
      FORGEJO_REPO: ${FORGEJO_REPO:-NEX}
      GITHUB_OWNER: XDavi196
      GITHUB_REPO: NEX
      SYNC_ASSET_RELEASES: ${SYNC_ASSET_RELEASES:-8}
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-1800}
    volumes:
      - ./sync-releases.py:/app/sync-releases.py:ro
    command: ["sh", "-c", "while true; do python /app/sync-releases.py || true; sleep ${SYNC_INTERVAL_SECONDS:-1800}; done"]
    depends_on:
      - forgejo
    networks:
      - nex-git

networks:
  nex-git:

volumes:
  forgejo-data:
  caddy-data:
  caddy-config:
