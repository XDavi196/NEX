services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:17.0.1
    container_name: nex-forgejo-codespaces
    restart: unless-stopped
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__server__DOMAIN: ${CODESPACE_NAME:?Open this project in GitHub Codespaces}-3000.app.github.dev
      FORGEJO__server__ROOT_URL: https://${CODESPACE_NAME:?Open this project in GitHub Codespaces}-3000.app.github.dev/
      FORGEJO__server__HTTP_PORT: "3000"
      FORGEJO__server__PROTOCOL: http
      FORGEJO__server__START_SSH_SERVER: "false"
      FORGEJO__server__DISABLE_SSH: "true"
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__actions__ENABLED: "false"
    volumes:
      - nex-forgejo-codespaces-data:/data
    ports:
      - "3000:3000"

volumes:
  nex-forgejo-codespaces-data:
