name: Build NEX Android

on:
  workflow_dispatch:
  push:
    branches:
      - nex/eden-v0.2.0-rc1-nextendo
    paths:
      - "README.md"
      - "integration/android/**"
      - "scripts/**"
      - ".github/workflows/build-nex-android.yml"
      - "docs/EDEN_BASE.md"
      - "docs/NEXTENDO_ONLINE_STATUS.md"
permissions:
  contents: write

# Keep one full native build per branch. New commits cancel stale 30-minute builds.
concurrency:
  group: nex-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-optimized:
    name: Eden v0.2.0-rc1 — Android Optimized / NEX
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout NEX overlay
        uses: actions/checkout@v4
        with:
          path: nex
          persist-credentials: false

      - name: Checkout pinned Eden source
        uses: actions/checkout@v4
        with:
          repository: eden-emulator/mirror
          ref: v0.2.0-rc1
          path: eden
          submodules: recursive
          persist-credentials: false

      - name: Verify Eden release commit
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git -C eden rev-parse HEAD)"
          expected="8e373eb714aa01117ec885680477501cdb572112"
          test "$actual" = "$expected" || {
            echo "Expected Eden $expected, received $actual"
            exit 1
          }

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install pinned Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Install native build utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache p7zip-full xz-utils glslang-tools

      - name: Apply NEX identity and Nextendo Android integration
        run: |
          python3 nex/scripts/apply-eden-overlay.py eden

      - name: Build NEX Android Optimized APK
        working-directory: eden
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          CCACHE: "true"
        run: |
          chmod +x .ci/android/build.sh
          .ci/android/build.sh -r -t optimized -b Release

      - name: Rename NEX artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p nex-artifacts
          find eden/artifacts -maxdepth 1 -type f -name "*.apk" -print -quit | grep -q .
          apk="$(find eden/artifacts -maxdepth 1 -type f -name "*.apk" -print -quit)"
          cp "$apk" "nex-artifacts/NEX-Android-v0.2.0-rc1-optimized.apk"
          aab="$(find eden/artifacts -maxdepth 1 -type f -name "*.aab" -print -quit || true)"
          if [ -n "$aab" ]; then
            cp "$aab" "nex-artifacts/NEX-Android-v0.2.0-rc1-optimized.aab"
          fi
          sha256sum nex-artifacts/* > nex-artifacts/SHA256SUMS.txt

      - name: Upload NEX Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NEX-Android-v0.2.0-rc1-optimized
          path: nex-artifacts/*
          if-no-files-found: error
          retention-days: 14

      # The first preview is released only when a maintainer explicitly marks
      # the triggering commit with a [release] subject. Failed builds never publish.
      - name: Publish experimental GitHub prerelease
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, '[release]')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v0.1.0-alpha.${GITHUB_RUN_NUMBER}"
          gh release create "$tag" \
            nex-artifacts/NEX-Android-v0.2.0-rc1-optimized.apk \
            nex-artifacts/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "NEX $tag" \
            --prerelease \
            --notes "Experimental Android preview based on Eden v0.2.0-rc1. Account sign-in and presence scaffolding still require live service validation. In-game online multiplayer is NOT implemented or verified: BAAS/nnex authentication, game-side friends IPC, DNS/TLS routing, PRUDP, matchmaking, NAT traversal and P2P remain unfinished. Read the repository README for project status, license and independence notices."
